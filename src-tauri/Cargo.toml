[package]
name = "gamelibrarymanager"
description = "Biblioteca unificada de juegos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gamelibrarymanager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
domain.workspace = true
storage.workspace = true
connectors.workspace = true
metadata.workspace = true
secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
time.workspace = true
uuid.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Para comprobar los patrones de alcance de la capacidad con la misma
# implementación que usa tauri-plugin-opener en tiempo de ejecución.
glob = "0.3"
wiremock = "0.6"
tempfile = "3"
serde_json.workspace = true
