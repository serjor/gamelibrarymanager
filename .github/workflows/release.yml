name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Game Library Manager ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            Download the file for your system:

            - **Windows**: `Game.Library.Manager_<version>_x64-setup.exe`. The `.msi` is the same application for an installation managed by an administrator.
            - **Linux**: `Game.Library.Manager_<version>_amd64.AppImage`. Make it executable (`chmod +x`) and start it. The `.deb` and the `.rpm` are for the package manager of your distribution.
            - **macOS**: `Game.Library.Manager_<version>_aarch64.dmg`.
          releaseDraft: true
          prerelease: false

  # A release that has no Windows installer or no AppImage is not complete. The
  # matrix does not stop the other systems when one fails (fail-fast: false), so
  # this job examines the result and fails if one of the two is missing. A
  # complete release is published here; an incomplete one stays a draft.
  assets:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: The release has the Windows installer and the AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          missing=0
          for pattern in '_x64-setup\.exe$' '_amd64\.AppImage$'; do
            if ! grep -qE "$pattern" <<< "$assets"; then
              echo "::error::The release $TAG has no file that matches $pattern"
              missing=1
            fi
          done
          exit $missing
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
